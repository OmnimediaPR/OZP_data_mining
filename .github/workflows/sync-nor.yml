name: NOR sync

on:
  schedule:
    # Spouští se 2. v měsíci ve 3:00 UTC — den po NKIS, aby se neperverlo o runner.
    # NOR data ÚZIS aktualizuje cca 1× ročně (annual release), takže denní/týdenní
    # běh by stejně nepřinesl nová data.
    - cron: '0 3 2 * *'
  # Umožní ruční spuštění z GitHub UI (Actions → NOR sync → Run workflow).
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # potřeba pro commit nových dat zpět do repa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NOR sync
        run: python scripts/sync_nor.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nor/*.json
          if git diff --staged --quiet; then
            echo "Žádné změny v datech — nic ke commitnutí."
          else
            git commit -m "NOR sync: $(date -u +%Y-%m-%d)"
            git push
          fi
