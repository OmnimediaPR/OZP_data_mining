name: NZIP curated sync

on:
  schedule:
    # Spouští se 3. v měsíci ve 3:00 UTC (po NKIS a NOR).
    - cron: '0 3 3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NZIP curated sync
        run: python scripts/sync_nzip_curated.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nzip_curated/*.json
          if git diff --staged --quiet; then
            echo "Žádné změny v datech — nic ke commitnutí."
          else
            git commit -m "NZIP curated sync: $(date -u +%Y-%m-%d)"
            git push
          fi
