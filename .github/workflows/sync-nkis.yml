name: NKIS sync

on:
  schedule:
    # Spouští se 1. v měsíci ve 3:00 UTC (4:00 v ČR zimního času, 5:00 letního).
    - cron: '0 3 1 * *'
  # Umožní ruční spuštění z GitHub UI (Actions → NKIS sync → Run workflow).
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # potřeba pro commit nových dat zpět do repa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run NKIS sync
        run: python scripts/sync_nkis.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nkis/*.json
          if git diff --staged --quiet; then
            echo "Žádné změny v datech — nic ke commitnutí."
          else
            git commit -m "NKIS sync: $(date -u +%Y-%m-%d)"
            git push
          fi
